# Pushing a version tag (v1.0.1, matching manifest.json) builds the ZIP for
# the Chrome Web Store and publishes it as a GitHub release, with the notes
# from docs/releases/<tag>.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that the tag matches the manifest's version
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in manifest.json"
            exit 1
          fi
      - name: Unit tests
        run: npm test
      - name: Build the store ZIP
        run: zip -r "tree-of-tabs-$GITHUB_REF_NAME.zip" manifest.json LICENSE icons src -x "*.DS_Store"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" "tree-of-tabs-$GITHUB_REF_NAME.zip" \
            --title "Tree of Tabs ${GITHUB_REF_NAME#v}" "$@"
