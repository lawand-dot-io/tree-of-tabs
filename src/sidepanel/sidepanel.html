<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tree of Tabs</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="window-tip" class="tip" role="note" hidden>
      <p>
        <strong data-i18n="windowTipTitle"></strong>
        <!-- Filled in with the keyboard shortcut, or without it if there's none. -->
        <span data-shortcut="windowTip"></span>
      </p>
      <button id="window-tip-dismiss" class="button" data-i18n="gotIt"></button>
    </div>
    <div id="pinned" class="pinned" role="list" data-i18n-aria-label="pinnedTabs"></div>
    <div id="scroller" class="scroller">
      <div id="tree" class="tree" role="tree" data-i18n-aria-label="tabs"></div>
      <div id="new-tab" class="new-tab" role="button" tabindex="0" data-i18n-title="newTabTooltip">
        <span class="new-tab-icon"></span>
        <span data-i18n="newTab"></span>
      </div>
      <div id="drop-line" class="drop-line" hidden></div>
    </div>
    <div id="fullscreen-notice" class="notice" role="dialog" aria-labelledby="fullscreen-notice-title" hidden>
      <h2 id="fullscreen-notice-title" data-i18n="fullscreenTitle"></h2>
      <p data-i18n="fullscreenIntro"></p>
      <p data-shortcut="fullscreenReopen"></p>
      <div class="notice-buttons">
        <button id="fullscreen-hide" class="button filled" data-i18n="hideDuringFullscreen"></button>
        <button id="fullscreen-keep" class="button" data-i18n="keepItOpen"></button>
      </div>
      <p class="notice-footnote" data-i18n="changeLaterInSettings"></p>
    </div>
    <div id="menu" class="menu" role="menu" hidden></div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
