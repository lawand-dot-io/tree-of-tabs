<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="settingsPageTitle"></title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <!-- The texts come from _locales/ (see src/i18n.js). -->
    <main>
      <h1><img src="../../icons/icon128.png" alt="" />Tree of Tabs</h1>

      <h2 data-i18n="newTabsHeading"></h2>
      <section class="card">
        <label class="row">
          <span class="label">
            <span data-i18n="placeTabs"></span>
            <span class="hint" data-i18n="placeTabsHint"></span>
          </span>
          <select name="childPosition">
            <option value="end" data-i18n="asLastChild"></option>
            <option value="first" data-i18n="asFirstChild"></option>
          </select>
        </label>
        <label class="row">
          <span class="label">
            <span data-i18n="newTabAsChildSetting"></span>
            <span class="hint" data-i18n="newTabAsChildHint"></span>
          </span>
          <input type="checkbox" name="newTabAsChild" class="switch" />
        </label>
      </section>

      <h2 data-i18n="closingTabsHeading"></h2>
      <section class="card">
        <label class="row">
          <span class="label" data-i18n="whenParentClosed"></span>
          <select name="onCloseParent">
            <option value="promoteFirst" data-i18n="promoteFirst"></option>
            <option value="promoteAll" data-i18n="promoteAll"></option>
            <option value="closeAll" data-i18n="closeAllChildren"></option>
          </select>
        </label>
        <label class="row" data-needs-collapsing>
          <span class="label">
            <span data-i18n="closeCollapsedTree"></span>
            <span class="hint" data-i18n="closeCollapsedTreeHint"></span>
          </span>
          <input type="checkbox" name="closeCollapsedTree" class="switch" />
        </label>
      </section>

      <h2 data-i18n="appearanceHeading"></h2>
      <section class="card">
        <label class="row">
          <span class="label" data-i18n="density"></span>
          <select name="density">
            <option value="comfortable" data-i18n="comfortable"></option>
            <option value="compact" data-i18n="compact"></option>
          </select>
        </label>
        <label class="row">
          <span class="label" data-i18n="indentation"></span>
          <select name="indent">
            <option value="20" data-i18n="medium"></option>
            <option value="28" data-i18n="wide"></option>
          </select>
        </label>
        <label class="row">
          <span class="label">
            <span data-i18n="hideGuideLines"></span>
            <span class="hint" data-i18n="hideGuideLinesHint"></span>
          </span>
          <input type="checkbox" name="hideGuideLines" class="switch" />
        </label>
        <label class="row">
          <span class="label">
            <span data-i18n="turnOffCollapsing"></span>
            <span class="hint" data-i18n="turnOffCollapsingHint"></span>
          </span>
          <input type="checkbox" name="disableCollapsing" class="switch" />
        </label>
        <label class="row" data-needs-collapsing>
          <span class="label">
            <span data-i18n="autoExpand"></span>
            <span class="hint" data-i18n="autoExpandHint"></span>
          </span>
          <input type="checkbox" name="autoExpandOnActivate" class="switch" />
        </label>
        <label class="row">
          <span class="label">
            <span data-i18n="hideInFullscreen"></span>
            <span class="hint" data-i18n="hideInFullscreenHint"></span>
          </span>
          <input type="checkbox" name="hideInFullscreen" class="switch" />
        </label>
      </section>

      <h2 data-i18n="advancedHeading"></h2>
      <p class="section-note" data-i18n="advancedNote"></p>
      <section class="card">
        <label class="row">
          <span class="label">
            <span data-i18n="keepWindow"></span>
            <span class="hint" data-i18n="keepWindowHint"></span>
          </span>
          <input type="checkbox" name="keepWindowOnLastTab" class="switch" />
        </label>
      </section>

      <p class="footnote" data-i18n-fill="sidePanelTip">
        <a class="mono" id="appearance-link" href="chrome://settings/appearance">chrome://settings/appearance</a>
        <em data-i18n="chromeSidePanelPosition"></em>
        <em data-i18n="chromeShowOnLeft"></em>
      </p>

      <footer class="about">
        <p data-i18n-fill="feedback">
          <a href="https://github.com/lawand-dot-io/tree-of-tabs/issues" target="_blank" data-i18n="reportIt"></a>
          <a href="https://github.com/lawand-dot-io/tree-of-tabs/discussions/categories/feature-requests?discussions_q=is%3Aopen+category%3A%22Feature+requests%22+sort%3Atop" target="_blank" data-i18n="suggestFeature"></a>
        </p>
        <p>
          <span data-i18n="madeBy"></span>
          <!-- Only on a Mac, since Taskbar is a Mac app. -->
          <span id="mac-apps" hidden data-i18n="macApps"></span>
          <span data-i18n-fill="discover">
            <a href="https://lawand.io" target="_blank">lawand.io</a>
            <a href="https://x.com/lawand_dot_io" target="_blank">@lawand_dot_io</a>
          </span>
        </p>
      </footer>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
